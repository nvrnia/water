<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="st sd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
        <title id="st">Node v1 schematic</title>
        <desc id="sd">ESP32 DevKit powered over micro-USB drives two sensor connectors. GPIO 18 powers sensor A through J1 pin 1, sensor A's output returns on J1 pin 2 to GPIO 32, J1 pin 3 is ground. GPIO 19 powers sensor B through J2, which returns to GPIO 33. Sensors sit off-board on 10 cm leads.</desc>
        <rect width="660" height="400" fill="#FAF5F3"/>
        <g font-family="IBM Plex Mono, monospace">
          <!-- perfboard boundary -->
          <rect x="96" y="22" width="394" height="360" rx="14" fill="none" stroke="#C9B4B0" stroke-width="1.2" stroke-dasharray="5 4"/>
          <text x="108" y="16" font-size="11" fill="#907C78">perfboard</text>

          <!-- USB in -->
          <line x1="20" y1="100" x2="120" y2="100" stroke="#4F3030" stroke-width="1.5"/>
          <polygon points="120,100 111,95.5 111,104.5" fill="#4F3030"/>
          <text x="14" y="88" font-size="11" fill="#332624">USB charger</text>
          <text x="14" y="120" font-size="11" fill="#907C78">5 V</text>

          <!-- ESP32 block -->
          <rect x="120" y="40" width="180" height="290" rx="6" fill="#F2E6E3" stroke="#4F3030" stroke-width="1.5"/>
          <text x="210" y="66" font-size="13" font-weight="600" fill="#4F3030" text-anchor="middle">ESP32 DevKit V1</text>
          <text x="130" y="104" font-size="11" fill="#6B5450">micro-USB</text>
          <text x="130" y="150" font-size="10.5" fill="#907C78">on-board regulator</text>
          <text x="130" y="164" font-size="10.5" fill="#907C78">5 V → 3.3 V</text>

          <!-- right-side pins -->
          <g font-size="11.5" fill="#332624" text-anchor="end">
            <text x="292" y="94">GPIO 18*</text>
            <text x="292" y="124">GPIO 32</text>
            <text x="292" y="214">GPIO 19*</text>
            <text x="292" y="244">GPIO 33</text>
          </g>
          <text x="210" y="322" font-size="11.5" fill="#332624" text-anchor="middle">GND</text>

          <!-- channel A wires -->
          <line x1="300" y1="90" x2="440" y2="90" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="300" y1="120" x2="440" y2="120" stroke="#4F3030" stroke-width="1.5"/>
          <polygon points="300,120 309,115.5 309,124.5" fill="#4F3030"/>
          <text x="370" y="84" font-size="10.5" fill="#A85C3C" text-anchor="middle">VCC</text>
          <text x="370" y="114" font-size="10.5" fill="#A85C3C" text-anchor="middle">AOUT</text>

          <!-- channel B wires -->
          <line x1="300" y1="210" x2="440" y2="210" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="300" y1="240" x2="440" y2="240" stroke="#4F3030" stroke-width="1.5"/>
          <polygon points="300,240 309,235.5 309,244.5" fill="#4F3030"/>
          <text x="370" y="204" font-size="10.5" fill="#A85C3C" text-anchor="middle">VCC</text>
          <text x="370" y="234" font-size="10.5" fill="#A85C3C" text-anchor="middle">AOUT</text>

          <!-- J1 -->
          <rect x="440" y="76" width="30" height="88" rx="3" fill="#FAF5F3" stroke="#4F3030" stroke-width="1.5"/>
          <text x="455" y="70" font-size="11" font-weight="600" fill="#4F3030" text-anchor="middle">J1</text>
          <g font-size="10" fill="#907C78" text-anchor="middle"><text x="455" y="94">1</text><text x="455" y="124">2</text><text x="455" y="154">3</text></g>
          <line x1="440" y1="150" x2="416" y2="150" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="416" y1="150" x2="416" y2="160" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="405" y1="160" x2="427" y2="160" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="409" y1="164" x2="423" y2="164" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="413" y1="168" x2="419" y2="168" stroke="#4F3030" stroke-width="1.5"/>

          <!-- J2 -->
          <rect x="440" y="196" width="30" height="88" rx="3" fill="#FAF5F3" stroke="#4F3030" stroke-width="1.5"/>
          <text x="455" y="190" font-size="11" font-weight="600" fill="#4F3030" text-anchor="middle">J2</text>
          <g font-size="10" fill="#907C78" text-anchor="middle"><text x="455" y="214">1</text><text x="455" y="244">2</text><text x="455" y="274">3</text></g>
          <line x1="440" y1="270" x2="416" y2="270" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="416" y1="270" x2="416" y2="280" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="405" y1="280" x2="427" y2="280" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="409" y1="284" x2="423" y2="284" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="413" y1="288" x2="419" y2="288" stroke="#4F3030" stroke-width="1.5"/>

          <!-- ESP ground -->
          <line x1="210" y1="330" x2="210" y2="346" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="199" y1="346" x2="221" y2="346" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="203" y1="350" x2="217" y2="350" stroke="#4F3030" stroke-width="1.5"/>
          <line x1="207" y1="354" x2="213" y2="354" stroke="#4F3030" stroke-width="1.5"/>

          <!-- cables to sensors -->
          <line x1="470" y1="120" x2="530" y2="120" stroke="#A85C3C" stroke-width="3" stroke-dasharray="7 5"/>
          <line x1="470" y1="240" x2="530" y2="240" stroke="#A85C3C" stroke-width="3" stroke-dasharray="7 5"/>
          <text x="508" y="108" font-size="10" fill="#907C78" text-anchor="middle">lead</text>
          <text x="508" y="228" font-size="10" fill="#907C78" text-anchor="middle">lead</text>

          <!-- sensors -->
          <rect x="530" y="92" width="118" height="56" rx="6" fill="none" stroke="#4F3030" stroke-width="1.5"/>
          <text x="589" y="115" font-size="12" font-weight="600" fill="#4F3030" text-anchor="middle">sensor A</text>
          <text x="589" y="133" font-size="10.5" fill="#907C78" text-anchor="middle">in pot, coated</text>
          <rect x="530" y="212" width="118" height="56" rx="6" fill="none" stroke="#4F3030" stroke-width="1.5"/>
          <text x="589" y="235" font-size="12" font-weight="600" fill="#4F3030" text-anchor="middle">sensor B</text>
          <text x="589" y="253" font-size="10.5" fill="#907C78" text-anchor="middle">in pot, coated</text>

          <!-- reserved channels -->
          <text x="296" y="376" font-size="10.5" fill="#907C78" text-anchor="middle">J3, J4 reserved: GPIO 34, 35 in · not fitted</text>
        </g>
      </svg>
